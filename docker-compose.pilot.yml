# Pilot: a Mash host whose agents read this checkout.
#
# Setup (once), from the repo root: put GEMINI_API_KEY, OPENROUTER_API_KEY and
# MASH_HOST_SECRET (openssl rand -hex 32) in .env.
#
# Run, from the repo root:
#   docker compose -f docker-compose.pilot.yml up -d --build
#
# What this starts:
#   db    — Postgres 17, published on 127.0.0.1:5433
#   pilot — the Mash host running pilot.spec:build_pool, on 127.0.0.1:8000. Its
#           agents run as processes inside it. Through the Docker socket it
#           starts one sandbox per user (mash-sandbox-<key>), where the
#           agents' code runs; see `mash sandbox ls`. Links to files and
#           servers in a sandbox are served under 127.0.0.1:8000/s/.
#   sandbox-image — builds mash-sandbox:pilot from Dockerfile.sandbox, the
#           image every sandbox runs, then exits.
#
# This checkout is mounted read-only at /home/agent/mashpy in the host and in
# every sandbox, so the agents see your edits as you make them. Pilot's own
# code is baked into the images: after changing src/pilot or src/mash, run
# `up -d --build`. Sandboxes keep the image they were created from; remove them
# with `docker rm -f $(docker ps -aq --filter label=mash.sandbox.user)` to pick
# up a new one (their volumes are kept).
#
# Once healthy, use the pilot CLI:
#   pilot browse
#   pilot repl --host guide

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mash_pilot
      POSTGRES_USER: mash
      POSTGRES_PASSWORD: mash
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [mash]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mash -d mash_pilot"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  sandbox-image:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: mash-sandbox:pilot
    command: ["true"]
    restart: "no"

  pilot:
    build:
      context: .
      dockerfile: Dockerfile.pilot
    env_file: .env
    environment:
      # Override the host-machine DB URL from .env with the internal network address.
      MASH_DATABASE_URL: postgresql://mash:mash@db:5432/mash_pilot
      MASH_HOST_SECRET: ${MASH_HOST_SECRET:?set MASH_HOST_SECRET in .env}
      MASH_SANDBOX_IMAGE: mash-sandbox:pilot
      # Where your browser reaches this host, for the links agents hand out.
      MASH_PUBLIC_URL: http://127.0.0.1:8000
      # A Docker-host path, since the daemon resolves it for each sandbox.
      MASH_SANDBOX_MOUNTS: ${PWD}:/home/agent/mashpy:ro
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The changelog workflow's code step reads CHANGELOG.md on the host.
      - .:/home/agent/mashpy:ro
    # The image runs as `mash`; the socket belongs to root's group (0) on
    # Docker Desktop and usually to the `docker` group on Linux
    # (`stat -c %g /var/run/docker.sock`).
    group_add: ["0"]
    ports:
      - "127.0.0.1:8000:8000"
    networks: [mash]
    depends_on:
      db:
        condition: service_healthy
      sandbox-image:
        condition: service_completed_successfully
    restart: unless-stopped

networks:
  mash:
    name: mash

volumes:
  pgdata:
