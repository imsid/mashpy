name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Maintains a "release PR" that bumps pyproject.toml + CHANGELOG.md from the
  # Conventional Commits landed on main. Merging that PR creates the tag and
  # GitHub Release, which sets release_created=true for the publish job below.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Releases created by release-please use GITHUB_TOKEN, which does not trigger
  # the separate publish.yml (`on: release`). So we publish here instead, gated
  # on a release having just been created.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Build artifacts
        run: uv build

      - name: Check package metadata
        run: uvx twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # The sandbox image hosts run by default: ghcr.io/imsid/mash-sandbox at the
  # released mashpy version (mash.sandbox.provider.default_sandbox_image).
  publish-sandbox-image:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sandbox
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/imsid/mash-sandbox:${{ needs.release-please.outputs.version }}
            ghcr.io/imsid/mash-sandbox:latest

  # The browser image hosts run by default: ghcr.io/imsid/mash-browser at the
  # released mashpy version (mash.browser.provider.default_browser_image).
  publish-browser-image:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Smoke test the image before publishing it (scripts/smoke_browser_image.py).
      - name: Build the image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.browser
          load: true
          tags: mash-browser:release
          cache-from: type=gha,scope=browser-image

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Smoke test
        run: |
          uv sync --frozen --extra browser
          uv run python scripts/smoke_browser_image.py mash-browser:release

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.browser
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/imsid/mash-browser:${{ needs.release-please.outputs.version }}
            ghcr.io/imsid/mash-browser:latest
